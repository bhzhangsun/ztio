# ztio —— 自建 ZeroTier planet + controller
#
# 用法：
#   cp .env.example .env      # 填 ZTIO_PUBLIC_IP4
#   docker compose up -d --build
#
# 安全组入站规则：
#   UDP 9993  —— 必须。planet 的线协议端口，不放行则全网设备互相找不到。
#   UDP 9994  —— **可选**。这是 ztio-dns 容器自己的节点端口（它是这台机器上的
#                第二个 ZeroTier 节点，9993 被 planet 占了）。
#                不放行 = 那个成员与其它成员之间走 planet 中继：DNS 照常可用，
#                因为 planet 与 DNS 容器在同一台机器上，多出来的一跳是本地环回。
#                代价是①依赖 planet 活着 ②永远不自愈成直连。
#                本部署选择不放行（中继模式）。见 README「ztio-dns」一节。
# 不要放行 TCP 3443 / 3000 / 9993 —— 本编排不提供任何 HTTP 服务。

services:
  ztplanet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ZT_VERSION: "1.14.2"

    image: ztio/planet:1.14.2
    container_name: ztplanet
    restart: unless-stopped

    # ------------------------------------------------------------
    # 为什么用 host 网络
    # ------------------------------------------------------------
    # ZeroTier 的 VL1 依据「源地址」判断对端路径。走 Docker 的 bridge + DNAT
    # 会让这台 root 看到的地址与真实路径不一致，而 root 的职责恰恰是协助
    # 两端打洞 —— 地址错了就打不成。
    #
    # host 网络的附带好处：管理 API 直接落在 127.0.0.1:9993，控制面脚本
    # 用普通 curl 即可，不需要 docker exec。
    # 附带代价：管理 API 绑在 0.0.0.0（ZeroTier 在应用层拦截，见 local.conf
    # 的 allowManagementFrom），所以**必须**同时在主机防火墙/安全组上关掉 TCP 9993。
    network_mode: host

    environment:
      # 必填。阿里云 ECS 填弹性公网 IP。
      # 不要依赖镜像自动探测：目标服务器上 icanhazip 之类服务不可达（实测超时）。
      ZTIO_PUBLIC_IP4: "${ZTIO_PUBLIC_IP4:?必须设置 ZTIO_PUBLIC_IP4（本机公网 IPv4）}"

      # 选填。没有 IPv6 就留空，planet 里只写 IPv4 端点。
      ZTIO_PUBLIC_IP6: "${ZTIO_PUBLIC_IP6:-}"

      ZTIO_ZT_PORT: "9993"

      # 置 1 可强制重新生成 planet（会更新世界时间戳，客户端会重新握手一次）。
      ZTIO_FORCE_PLANET_REGEN: "${ZTIO_FORCE_PLANET_REGEN:-0}"

    volumes:
      # 必须持久化。这里面是节点身份、planet 签名密钥、网络定义与成员授权。
      # 丢了 identity 或 c25519 密钥，全网设备都会失联且无法自动恢复。
      #
      # ⚠️ 落在**系统路径**（默认 /var/lib/ztio），不是仓库里。
      # 放在 ./data 下即使 gitignore 了也只是防误提交 —— 删代码目录时会连数据一起删掉。
      # 路径由 .env 的 ZTIO_DATA_ROOT 决定，compose 与主机脚本读的是同一个值。
      - ${ZTIO_DATA_ROOT:-/var/lib/ztio}/one:/var/lib/zerotier-one
      # 对外分发的 planet。
      - ${ZTIO_DATA_ROOT:-/var/lib/ztio}/dist:/dist
      # ztio-dns 把节点地址写在这里 —— dns-setup 需要它才能把成员建对。
      # 只读：planet 没有理由改这个文件。
      - ${ZTIO_DATA_ROOT:-/var/lib/ztio}/run:/run/ztio:ro

    # ------------------------------------------------------------
    # 刻意不写的东西
    # ------------------------------------------------------------
    # devices: /dev/net/tun      —— planet + controller 不加入任何网络，不需要虚拟网卡
    # cap_add: NET_ADMIN         —— 同上，不需要改网络
    # cap_add: SYS_ADMIN         —— 同上
    #
    # 这三项是第三方镜像 xubiaolin/zerotier-planet 要求的。去掉之后容器权限
    # 大幅收窄：即使容器被攻破，也无法建虚拟网卡、无法改路由、无法挂载。

    mem_limit: 900m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # ztio-dns —— 网络内部的静态 DNS
  # ============================================================
  # 为什么单独一个容器，以及为什么用 bridge 而不是 host，见 dns/Dockerfile 顶部。
  # 一句话：planet 持有全网签名私钥，不该同时拥有「改网络」的能力。
  ztio-dns:
    build:
      context: ./dns
      args:
        ZT_VERSION: "1.14.2"

    image: ztio/dns:1.14.2
    container_name: ztiodns
    restart: unless-stopped

    depends_on:
      - ztplanet

    # 叶子节点，跟普通客户端一样。躲在 NAT 后面是 ZeroTier 的常态。
    # 换来的好处：NET_ADMIN 被限制在容器自己的网络命名空间里，够不到宿主机。
    network_mode: bridge

    environment:
      # 要加入的网络。**建网之后**才填（.env 里那个 ZTIO_NWID）。
      #
      # 这里刻意不用 ${ZTIO_NWID:?...} 强制报错：网络是部署之后才创建的，
      # 而 deploy.sh 会 `docker compose up -d` 整个编排 —— 强制报错会让
      # **首次部署直接失败**（.env 从 .env.example 复制而来时它必然为空）。
      # 留空时容器照常起来，只是不加入网络、没有可服务的接口，并在日志里说明。
      ZTIO_NWID: "${ZTIO_NWID:-}"
      # 9993 已被 planet 占用（host 网络），这里必须换一个。
      ZTIO_DNS_ZT_PORT: "9994"
      # 重读记录的间隔（秒）。DNS 是长驻进程，而成员名 / 新设备入网 /
      # 取消授权都会写进 controller 的落盘数据 —— 不重读就得重启容器。
      ZTIO_DNS_REFRESH: "30"

    volumes:
      # 自己的身份和数据目录，与 planet 完全分开。
      - ${ZTIO_DATA_ROOT:-/var/lib/ztio}/dns:/var/lib/zerotier-one
      # 只读：世界文件必须是我们自己的，否则节点会去连官方 root。
      - ${ZTIO_DATA_ROOT:-/var/lib/ztio}/dist:/dist:ro
      # 只读：DNS 的记录来源。不给 authtoken —— 为了读几个记录就把 controller
      # 的最高权限凭据交给另一个容器，是把最小权限原则倒过来用。
      - ${ZTIO_DATA_ROOT:-/var/lib/ztio}/one/controller.d/network:/ctr:ro
      # 节点地址写在这里，供控制面脚本读取（跨容器 exec 很别扭）。
      - ${ZTIO_DATA_ROOT:-/var/lib/ztio}/run:/run/ztio

    # 发布到宿主机，对端才可能直连（还要安全组放行 9994 —— 缺一不可）。
    # 不放行 = 走 planet 中继：DNS 照常可用，因为 planet 与这个容器同机，
    # 多出来的一跳是本地环回。本部署就是这么跑的，见 README「ztio-dns」一节。
    ports:
      - "9994:9994/udp"

    # 建虚拟网卡需要这两个。作用范围仅限本容器的网络命名空间。
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN

    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
